<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工审核 · QT</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
  <header class="topbar"><div class="brand">QT 视频数据生产工具 <small>人工审核</small></div><nav class="nav"><a href="/">生产台</a><a class="active" href="/review">人工审核</a></nav></header>
  <main class="page"><div class="review-layout">
    <section class="card"><div class="video-wrap"><video id="video" controls preload="metadata"></video><div class="empty" id="video-empty">暂无待审核候选</div></div><div class="clip-meta"><span id="source-meta">—</span><span id="clip-time">—</span></div></section>
    <aside class="card">
      <div class="section-head"><div><h2>候选判断</h2><p id="queue-meta">载入中…</p></div></div>
      <div class="recommend"><div><label>桶</label><select id="bucket"></select></div><div><label>单元</label><select id="unit"></select></div><div><label>人称</label><select id="viewpoint"><option value="">待人工判断</option><option value="first_person">第一人称</option><option value="third_person">第三人称</option></select></div></div>
      <textarea id="notes" rows="2" placeholder="拒绝原因、if→then、物理反馈等备注"></textarea>
      <div class="rule-list" id="rules"><div class="empty">请选择候选</div></div>
      <div class="actions"><button id="accept">接受 A</button><button class="danger" id="reject">拒绝 R</button><button class="secondary wide" id="edit">保存标签 E</button><button class="secondary" id="prev">← 上一条</button><button class="secondary" id="next">下一条 →</button></div>
      <div class="hotkeys">快捷键：A 接受 · R 拒绝 · E 保存标签 · Space 播放/暂停 · ←/→ 前后候选</div>
      <div class="notice" id="notice"></div>
    </aside>
  </div></main>
  <aside class="drawer" id="drawer"><button class="secondary" id="close-drawer" style="float:right">关闭</button><h2 id="drawer-title">规则</h2><div id="drawer-body"></div></aside>
  <script src="/static/review.js"></script>
</body></html>
